root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags=jwx_es256k -o ./tmp/main ./cmd/alexandria"
  bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = ["tmp", "bin", "vendor", "testdata", "migrations"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"

[misc]
  clean_on_exit = true
