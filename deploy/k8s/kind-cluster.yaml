# A kind cluster whose ingress controller is reachable on the host's 80 and
# 443, which is what makes the nip.io names in values-dev.yaml resolve to
# something: alexandria.127.0.0.1.nip.io answers 127.0.0.1, and 127.0.0.1:80
# has to be the controller.
#
#   kind create cluster --config deploy/k8s/kind-cluster.yaml
#
# See deploy/k8s/README.md for what to install into it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: alexandria
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # What ingress-nginx's kind manifest selects on when it schedules the
      # controller with hostPorts.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
