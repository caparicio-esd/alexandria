{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "alexandria.serviceAccountName" . }}
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The node calls out — to its database, its identity provider and a wallet —
# and is called by the ingress. It never talks to the Kubernetes API, so the
# token that would let it is not mounted.
automountServiceAccountToken: false
{{- end }}
