{{- if not .Values.existingSecret }}
# Rendered from values, which means the values file that carries them is itself
# a secret and must not be committed. A deployment that would rather not put
# them in a values file at all sets `existingSecret` and manages the Secret
# elsewhere — sealed-secrets, external-secrets, or by hand — and the chart never
# sees them.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alexandria.fullname" . }}-secrets
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  # With the bundled subchart the password lives in the Secret that chart
  # creates, and the Deployment reads it from there instead.
  ALEXANDRIA_COMMON_CONFIG_DB_PASSWORD: {{ required "database.password is required" .Values.database.password | quote }}
  {{- end }}
  {{- if .Values.auth.enabled }}
  ALEXANDRIA_AUTH_CONFIG_CLIENT_SECRET: {{ .Values.auth.clientSecret | quote }}
  # 32 bytes of hex. It seals every session cookie, so it has to be the same in
  # every replica and stable across upgrades: generated here, once, and kept.
  ALEXANDRIA_AUTH_CONFIG_SESSION_KEY: {{ required "auth.sessionKey is required — generate one with `openssl rand -hex 32`" .Values.auth.sessionKey | quote }}
  {{- end }}
  {{- range $key, $value := .Values.extraSecretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
