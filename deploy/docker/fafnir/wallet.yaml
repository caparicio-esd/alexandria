# The wallet's own configuration for this deployment. Not the node's — that is
# ../config.yaml.
#
# It carries no credentials. The wallet reads those from a JSON file that the
# fafnir-init container writes into a volume from the environment, so the
# password exists in .env and nowhere else — there is no second copy here to
# drift out of step with the database that has to accept it.

http_host: &http_host
  protocol: "http"
  # What the process advertises inside its own container; is_docker below is
  # what makes it listen on every interface, so the node reaches it at
  # http://fafnir-wallet:7001 on this network. Nothing outside reaches it at
  # all: the wallet is not proxied by Caddy and publishes no port, because the
  # node is the only thing that talks to it.
  url: "127.0.0.1"
  port: null
  internal_port: "7001"

hosts:
  http: *http_host
  grpc: null
  graphql: null

db_config:
  db_type: Postgres
  url: "fafnir-db"
  port: "5432"

is_docker: true

# False, so the credentials come off disk rather than from a real Vault. See
# "The wallet" in ../README.md for what that costs and what replaces it.
is_vault_real: false
