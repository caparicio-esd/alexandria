# Local infrastructure. The node itself runs on the host, with `task dev`.
#
# The credentials mirror common_config.db in config/config.yaml, which is where
# the node reads them from. They are development values in a committed file on
# both sides; a real deployment renders its own.

services:
  postgres:
    image: postgres:17-alpine
    container_name: alexandria-postgres
    restart: unless-stopped
    environment:
      # Overridable, so a second checkout can run its own without editing the
      # file, but the defaults are what config/config.yaml expects.
      POSTGRES_USER: ${ALEXANDRIA_DB_USER:-alexandria}
      POSTGRES_PASSWORD: ${ALEXANDRIA_DB_PASSWORD:-alexandria}
      POSTGRES_DB: ${ALEXANDRIA_DB_NAME:-alexandria}
    ports:
      # Matches common_config.db.port in config/config.yaml. Non-standard on
      # purpose: alexandria owns this database, and the port has to stay clear
      # of the eunomia containers already on 1300, 1400 and 1450.
      - "127.0.0.1:1500:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the substitution: these are the container's variables, not
      # compose's.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ===== Zitadel ============================================================
  # The identity provider. The node proxies it: nothing outside this compose
  # file — no browser, no peer — is expected to address it directly, and in a
  # real deployment it need not be published at all.
  zitadel-db:
    image: postgres:17-alpine
    container_name: alexandria-zitadel-db
    restart: unless-stopped
    environment:
      # Overridable on the same terms as the node's own database above: the
      # defaults are what the zitadel service below expects.
      POSTGRES_USER: ${ZITADEL_DB_USER:-zitadel}
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadel}
      POSTGRES_DB: ${ZITADEL_DB_NAME:-zitadel}
    volumes:
      - zitadel-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the substitution: these are the container's variables, not
      # compose's.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ===== Wallet =============================================================
  # The node's identity. It holds the private key and does the signing;
  # alexandria never sees key material — see docs/adr/0003. The image is
  # published elsewhere, so what this project owns is only how it runs:
  # config/fafnir/wallet.yaml, and the database below.
  fafnir-db:
    image: postgres:17-alpine
    container_name: alexandria-fafnir-db
    restart: unless-stopped
    environment:
      # These have to match config/fafnir/db.json, which is where the wallet
      # reads them from while is_vault_real is false.
      POSTGRES_USER: ${FAFNIR_DB_USER:-fafnir}
      POSTGRES_PASSWORD: ${FAFNIR_DB_PASSWORD:-fafnir}
      POSTGRES_DB: ${FAFNIR_DB_NAME:-fafnir}
    volumes:
      - fafnir-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Migrations and key setup. A one-shot container that runs before the wallet
  # and exits; the wallet waits on it completing rather than on it running.
  fafnir-setup:
    image: ${FAFNIR_IMAGE:-rmenendez8/fafnir:v0.2.0}
    container_name: alexandria-fafnir-setup
    depends_on:
      fafnir-db:
        condition: service_healthy
    volumes:
      - ./config/fafnir/wallet.yaml:/app/static/fafnir/config.yaml:ro
      # The private keys. With is_vault_real false the wallet keeps them as
      # files here, one per key id — not in Postgres, which holds only their
      # metadata. So this is a volume and not the container's own layer: on the
      # container layer the node's identity would not survive a
      # `docker compose up --force-recreate` or an image bump.
      - fafnir-keys:/app/vault/secrets
      # The database credential, mounted read-only on top of that volume. Last
      # mount by path depth wins, so the file is this one and the directory
      # around it stays writable.
      - ./config/fafnir/db.json:/app/vault/secrets/db.json:ro
    environment:
      RUST_BACKTRACE: 1
      # Where that directory is, and which file in it holds the database
      # credential. The wallet refuses to start without both.
      VAULT_PATH: /app/vault/secrets
      VAULT_APP_DB: db.json
    env_file:
      # Optional. The published wallet needs nothing else; this is the seam for
      # a build of it that does, without editing this file.
      - path: ./config/fafnir/env
        required: false
    command: ["setup", "--env-file", "/app/static/fafnir/config.yaml"]

  fafnir-wallet:
    image: ${FAFNIR_IMAGE:-rmenendez8/fafnir:v0.2.0}
    container_name: alexandria-fafnir-wallet
    restart: unless-stopped
    depends_on:
      fafnir-setup:
        condition: service_completed_successfully
    volumes:
      - ./config/fafnir/wallet.yaml:/app/static/fafnir/config.yaml:ro
      - fafnir-keys:/app/vault/secrets
      - ./config/fafnir/db.json:/app/vault/secrets/db.json:ro
    environment:
      RUST_BACKTRACE: 1
      VAULT_PATH: /app/vault/secrets
      VAULT_APP_DB: db.json
    env_file:
      - path: ./config/fafnir/env
        required: false
    command: ["start", "--env-file", "/app/static/fafnir/config.yaml"]
    ports:
      # 7001 inside, 7003 on the host: `task dev` runs the node on the host, and
      # 7003 is what wallet_config.api.http.port in config/config.yaml says.
      # Not 7002, and not 7000 or 7001 either: the eunomia checkout publishes
      # its own wallets there, and a checkout that cannot run while its sibling
      # is up is a checkout that does not stand alone. Point the node at one of
      # those instead with ALEXANDRIA_WALLET_CONFIG_API_HTTP_PORT.
      - "127.0.0.1:${FAFNIR_HOST_PORT:-7003}:7001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7001/readiness"]
      interval: 10s
      timeout: 2s
      retries: 10
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===== TLS ================================================================
  # Terminates https for both the node and Zitadel, using the local certificate
  # authority Caddy already keeps on this machine — mounted read-only, so the
  # certificates it issues are signed by a root the browser trusts and nothing
  # new has to be installed.
  caddy:
    image: caddy:2-alpine
    container_name: alexandria-caddy
    restart: unless-stopped
    ports:
      # 8443 rather than 443, because Docker Desktop only forwards privileged
      # ports when its "allow privileged port mapping" setting is on, and when
      # it is off the connection is reset mid-handshake with no error anywhere.
      # Set TLS_PORT=443 if yours allows it, and drop the port from the URLs
      # below.
      - "127.0.0.1:${TLS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The project's own certificate authority — root certificate and signing
      # key — generated by `task tls:ca` and gitignored. In the project rather
      # than in the machine's own Caddy directory, so a checkout carries
      # everything it needs and nothing points outside the repository.
      - ./.certs:/pki:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      # `task dev` runs the node on the host, not in a container.
      - "host.docker.internal:host-gateway"

  # Zitadel runs as uid 1000 and its image is distroless — no shell, no /tmp,
  # nothing of its own it can write to. So the one file it has to write, the
  # token below, needs a volume, and a volume is created root-owned. This
  # one-shot container is the only declarative way to fix that; it runs before
  # zitadel and exits. A tmpfs would avoid it, but `docker cp` cannot read one.
  zitadel-init:
    image: alpine:3.22
    container_name: alexandria-zitadel-init
    command: ["chown", "-R", "1000:1000", "/machinekey"]
    volumes:
      - zitadel-machinekey:/machinekey

  zitadel:
    # Pinned, and overridable: an identity provider that changes underneath a
    # `docker compose pull` is a change to how every login behaves.
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.17.2}
    container_name: alexandria-zitadel
    restart: unless-stopped
    command: "start-from-init --masterkeyFromEnv"
    environment:
      # 32 bytes exactly, and development-only: it encrypts every secret
      # Zitadel stores. A deployment generates its own and mounts it.
      # TLS is off because the node reaches this over the compose network and a
      # browser reaches it over loopback; a deployment terminates TLS in front
      # of it. As an environment variable rather than the --tlsMode flag, so
      # that `zitadel ready` — the healthcheck below, a separate process — sees
      # it too and does not go looking for https on a plain-http listener.
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${ZITADEL_DB_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadel}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # The issuer every token names, and the address the browser is redirected
      # to. It has to match auth_config.issuer in config/config.yaml exactly —
      # a mismatch is refused at discovery rather than silently accepted.
      # Overriding either of these means overriding auth_config.issuer on the
      # node too — with ALEXANDRIA_AUTH_CONFIG_ISSUER — or discovery is refused.
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:-auth.127.0.0.1.nip.io}
      ZITADEL_EXTERNALPORT: ${TLS_PORT:-8443}
      # Caddy in front terminates it; Zitadel itself still serves plain HTTP on
      # the compose network. This only tells it to mint https URLs.
      ZITADEL_EXTERNALSECURE: ${ZITADEL_SECURE:-true}
      # Zitadel v4 redirects to a login UI that ships as a separate container.
      # Turning the requirement off keeps the classic login, which is built into
      # this image and needs nothing else running.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      # The first console login. Development values in a committed file, like
      # the database credentials above.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG:-alexandria}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USER:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Password1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      # A machine user, created with the instance, and a personal access token
      # written to a volume. This is what makes the project and the application
      # scriptable — see `task auth:bootstrap` — instead of a console
      # walkthrough that everybody performs slightly differently.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ${ZITADEL_SA_USER:-alexandria-bootstrap}
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: "Alexandria bootstrap"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      # The token the instance mints for that machine user, which is what makes
      # `task auth:bootstrap` possible: the management API needs a credential,
      # and this is the only one that exists before anything has been set up.
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
    volumes:
      - zitadel-machinekey:/machinekey
    ports:
      # Direct, unproxied access, for debugging and for a deployment that puts
      # its own proxy in front. The browser and the node both go through Caddy
      # on 443 instead. Clear of the node (1234), its database (1500) and the
      # eunomia containers already on 1300, 1400 and 1450.
      - "127.0.0.1:${ZITADEL_HOST_PORT:-1600}:8080"
    depends_on:
      zitadel-db:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  zitadel-data:
  zitadel-machinekey:
  fafnir-data:
  fafnir-keys:
