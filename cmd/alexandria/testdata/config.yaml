# Minimal deployment document for the composition-root tests. Port 0 makes the
# kernel pick a free port, so the tests never collide with a running node.
ssi_auth:
  common_config:
    hosts:
      http: {protocol: 'http', url: '127.0.0.1', port: '0', internal_port: null}
      grpc: null
      graphql: null
    db: {db_type: Memory}
    api: {version: 'v1', openapi_path: './openapi.json'}
    connection: {is_local: true, is_prod: false, is_vault_real: false, has_tls_proxy: false}
  wallet_config:
    wallet: Fafnir
    api:
      http: {protocol: 'http', url: '127.0.0.1', port: '7002'}
      grpc: null
      graphql: null
  client_config: {class_id: 'Provider', display: null}
  verify_req_config: {is_cert_allowed: false, auto_approve_cert: false, vcs_requested: [DataSpaceParticipant]}
  did_config: {type: Jwk}
  gaia_config: null
