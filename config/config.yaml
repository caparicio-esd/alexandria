# Local development deployment.
#
# This is the file `alexandria` picks up with no --config flag: Discover looks
# for config.yaml in ".", "./config" and "/etc/alexandria", in that order.
#
# The sections sit at the root, because this file describes this node and
# nothing else. A shared dataspace deployment file — the one catalog, contracts,
# transfer and gateway also read — nests these same sections under an "ssi_auth"
# key instead; the loader accepts either, so both kinds of file work unchanged.
#
# Any setting can be overridden from the environment without editing the file:
# the variable is ALEXANDRIA_ plus the dotted path, upper-cased. To point at a
# wallet on another port:
#
#   ALEXANDRIA_WALLET_CONFIG_API_HTTP_PORT=7001 task dev
#
# Carries no secrets: database credentials and key material are resolved at run
# time from the environment and from Vault.

common_config:
  hosts:
    http:
      protocol: "http"
      url: "127.0.0.1"
      port: "1200"
      internal_port: null
    grpc: null
    graphql: null
  db:
    db_type: Postgres
    url: "127.0.0.1"
    port: "1500"
  api:
    version: "v1"
    openapi_path: "./static/specs/openapi/merged_openapi.json"
  connection:
    is_local: true
    is_prod: false
    is_vault_real: false
    has_tls_proxy: false

wallet_config:
  wallet: Fafnir
  api:
    http:
      protocol: "http"
      url: "127.0.0.1"
      port: "7002"
    grpc: null
    graphql: null
  # How long startup blocks waiting for the wallet. Past it the node comes up
  # anyway and reports itself not ready, while it keeps retrying.
  startup_link_timeout: "10s"

# Everything here has a default, so an older deployment file still works.
observability:
  log_level: "info" # debug | info | warn | error
  log_format: "auto" # auto (text on a terminal, JSON otherwise) | text | json
  metrics: true # /metrics on the internal port below
  pprof: false # /debug/pprof, off by default: a heap dump says a lot
  port: "2112" # internal listener; empty switches it off
client_config:
  class_id: "Provider"
  display: null
verify_req_config:
  is_cert_allowed: false
  auto_approve_cert: false
  vcs_requested: [DataSpaceParticipant]
did_config:
  type: Jwk
gaia_config: null
