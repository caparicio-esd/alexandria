version: "3"

vars:
  BIN: alexandria
  MAIN: ./cmd/alexandria
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    cmds: [{ task: check }]

  fmt:
    desc: Format the code with gofumpt.
    cmds: ["go tool gofumpt -w ."]

  lint:
    desc: Run golangci-lint.
    cmds: ["go tool golangci-lint run"]

  test:
    desc: Run tests with the race detector and a coverage profile.
    cmds: ["go test -race -coverprofile=coverage.out ./..."]

  cover:
    desc: Open the coverage report in the browser.
    deps: [test]
    cmds: ["go tool cover -html=coverage.out"]

  build:
    desc: Build the binary into bin/.
    cmds:
      - go build -ldflags="-s -w -X main.version={{.VERSION}}" -o bin/{{.BIN}} {{.MAIN}}

  run:
    desc: Run the application.
    cmds: ["go run {{.MAIN}}"]

  dev:
    desc: Hot reload with air.
    cmds: ["go tool air"]

  db:up:
    desc: Start the local Postgres and wait for it to accept connections.
    cmds: ["docker compose up -d --wait postgres"]

  db:down:
    desc: Stop the local Postgres, keeping its data.
    cmds: ["docker compose down"]

  db:reset:
    desc: Destroy the local Postgres and its data, then start it again.
    prompt: This deletes the local database volume. Continue?
    cmds:
      - docker compose down -v
      - task: db:up

  db:psql:
    desc: Open a psql shell on the local Postgres.
    dotenv: [".env"]
    cmds: ["docker compose exec postgres psql -U $ALEXANDRIA_DB_USER -d $ALEXANDRIA_DB_NAME"]

  db:logs:
    desc: Follow the local Postgres logs.
    cmds: ["docker compose logs -f postgres"]

  tidy:
    desc: Sync go.mod and go.sum.
    cmds: ["go mod tidy"]

  vuln:
    desc: Scan for known vulnerabilities.
    cmds: ["go run golang.org/x/vuln/cmd/govulncheck@latest ./..."]

  check:
    desc: "Full pipeline: format, lint and tests."
    cmds:
      - task: fmt
      - task: lint
      - task: test
