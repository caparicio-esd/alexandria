version: "2"
linters:
  default: standard
  enable:
    - errcheck # unchecked error returns
    - govet
    - staticcheck
    - revive
    - errorlint # correct use of %w and errors.As
    - bodyclose
    - contextcheck
    - noctx
    - sqlclosecheck
    - gosec
    - misspell
    - unconvert
    - gochecksumtype # exhaustive type switches over sealed interfaces
    - wastedassign
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable: [gofumpt, goimports]
